[project]
name = "gitops-engine"
dynamic = ["version"]
description = "A small engine for reconciling declarative definitions in git against live systems."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mark Davidoff" }]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/gitops_engine/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gitops_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["examples"]

[tool.ruff]
line-length = 100
target-version = "py312"
